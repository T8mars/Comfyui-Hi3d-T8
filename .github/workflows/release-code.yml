name: Publish code-only release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: code-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Require the matching version tag
        shell: bash
        run: |
          VERSION=$(python -c 'from hi3d_workbench.common import VERSION; print(VERSION)')
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/v$VERSION^{commit}")"
      - run: python -m pip install 'httpx>=0.28,<1' 'filelock>=3,<4' pytest psutil
      - run: python -m pytest tests/test_updater.py -q
      - run: python tools/prepare_release_upstream.py
      - run: python tools/build_release.py --dist-root dist/public
      - name: Publish source, nodes and code updater only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(python -c 'from hi3d_workbench.common import VERSION; print(VERSION)')
          TAG="v$VERSION"
          test "${GITHUB_REF_TYPE}" != tag || test "${GITHUB_REF_NAME}" = "$TAG"
          FILES=("dist/public/Hi3D-Workbench-source-$VERSION.zip" "dist/public/ComfyUI-Hi3D-nodes-$VERSION.zip" "dist/public/Hi3D-Workbench-update-$VERSION.zip" "dist/public/update-manifest.json" "dist/public/SHA256.json")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          elif test -f "docs/releases/$TAG.md"; then
            gh release create "$TAG" "${FILES[@]}" --verify-tag --title "Hi3D T8 $TAG" --notes-file "docs/releases/$TAG.md"
          else
            gh release create "$TAG" "${FILES[@]}" --verify-tag --title "Hi3D T8 $TAG" --generate-notes
          fi
      - name: Publish matching ComfyUI Registry version
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
