[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hi3d-t8"
version = "0.3.1"
description = "Local Hi3D v1.0 workbench and ComfyUI integration"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "Pillow>=10.3", "trimesh>=4.6,<5"]
classifiers = ["Operating System :: Microsoft :: Windows", "Operating System :: POSIX :: Linux", "Environment :: GPU :: NVIDIA CUDA"]

[project.optional-dependencies]
workbench = ["fastapi==0.115.12", "uvicorn==0.34.2", "python-multipart==0.0.20", "pillow>=10.3,<12", "numpy>=1.26,<2", "scipy>=1.13,<1.16", "networkx>=3,<4", "httpx>=0.28,<1", "psutil>=7,<8", "huggingface-hub>=0.34,<1", "hf_xet>=1.1,<2"]

[project.urls]
Repository = "https://github.com/T8mars/Comfyui-Hi3d-T8"
Documentation = "https://github.com/T8mars/Comfyui-Hi3d-T8/blob/main/README.md"
"Bug Tracker" = "https://github.com/T8mars/Comfyui-Hi3d-T8/issues"
Models = "https://huggingface.co/t8star/Hi3d-Comfy"

[tool.comfy]
PublisherId = "t8star"
DisplayName = "Hi3D T8 — Geometry Refinement"
requires-comfyui = ">=0.34.0"

[project.scripts]
hi3d-workbench = "hi3d_workbench.__main__:main"

[tool.setuptools.packages.find]
include = ["hi3d_workbench*"]

[tool.setuptools.package-data]
hi3d_workbench = ["web/*", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
